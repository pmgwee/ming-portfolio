<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Career Plan 职业规划表｜Free career planning tool · Ming Creatives</title>
<link rel="canonical" href="https://www.mingcreatives.com/product/career-plan">
<meta property="og:url" content="https://www.mingcreatives.com/product/career-plan">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.mingcreatives.com/opengraph-image">
<meta name="description" content="先写下终点，再倒推回今天，然后问：这份工，给得了吗？5 分钟生成属于你的职业规划报告。">
<meta property="og:title" content="职业规划表｜这份工，给得了吗？">
<meta property="og:description" content="5 分钟，生成属于你自己的职业规划报告。">
<meta name="theme-color" content="#141414">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #141414;
    --ink-2: #2a2a2a;
    --muted: #6b6b6b;
    --hint: #a3a3a3;
    --line: #e2e0d8;
    --line-strong: #cfcfcf;
    --yellow: #ffd400;
    --yellow-soft: #fff8cc;
    --paper: #ffffff;
    --soft: #f6f5f0;
    --bg: #fbfaf6;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20,20,20,.04), 0 8px 24px rgba(20,20,20,.06);
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 16px; line-height: 1.6; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; border-radius: 6px; }
  mark { background: linear-gradient(transparent 58%, var(--yellow) 58%); color: inherit; padding: 0 2px; }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20; background: rgba(251,250,246,.92);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner { max-width: 720px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .brand { font-weight: 900; letter-spacing: .5px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 0 3px var(--ink); }
  .topbar .spacer { flex: 1; }
  .brand { color: inherit; text-decoration: none; }
  .home-link { font-size: 13px; font-weight: 700; color: var(--ink); text-decoration: none; border: 1.5px solid var(--ink); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
  .home-link:hover { background: var(--yellow); }
  .lang-toggle { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; padding: 2px; font-size: 12px; font-weight: 700; }
  .lang-toggle button { border-radius: 999px; padding: 3px 10px; color: var(--muted); }
  .lang-toggle button[aria-pressed="true"] { background: var(--ink); color: var(--yellow); }
  .saved { font-size: 12px; color: var(--muted); transition: opacity .3s; }
  @media (max-width: 520px) {
    .topbar-inner { gap: 8px; }
    .topbar .brand { flex: none; font-size: 13px; white-space: nowrap; margin-inline-end: auto; }
    .topbar .saved, .topbar .spacer { display: none; }
    .lang-toggle { flex: none; }
    .lang-toggle button { padding: 4px 8px; white-space: nowrap; }
    .home-link { font-size: 11px; padding: 4px 8px; }
  }
  .progress { height: 4px; background: var(--line); }
  .progress > i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .4s cubic-bezier(.2,.7,.2,1); }

  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 140px; }

  /* ---------- landing ---------- */
  .hero { padding: 28px 0 8px; }
  .kicker { font-size: 13px; color: var(--muted); letter-spacing: 1px; }
  .hero h1 { font-size: clamp(44px, 12vw, 72px); line-height: 1.05; font-weight: 900; margin: 8px 0 14px; }
  .hero h1 mark { padding: 0 4px; }
  .hero p.lead { font-size: 18px; }
  .hero p.lead b { background: var(--yellow); padding: 0 4px; }
  .hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin: 26px 0 10px; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .steps-preview { display: grid; gap: 12px; margin-top: 34px; }
  .sp { display: flex; gap: 14px; align-items: flex-start; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .sp h3 { font-size: 16px; font-weight: 900; }
  .sp p { font-size: 14px; color: var(--muted); }
  .num {
    flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--yellow);
    display: grid; place-items: center; font-weight: 900; font-size: 15px;
  }
  .quote-band { margin-top: 34px; background: var(--ink); color: #fff; border-radius: var(--radius); padding: 22px; }
  .quote-band b { color: var(--yellow); }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 0 22px; border-radius: 999px; font-weight: 700; font-size: 16px;
    transition: transform .12s, box-shadow .2s, background .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--ink); color: #fff; box-shadow: 0 4px 0 var(--yellow); }
  .btn-primary:hover { box-shadow: 0 6px 0 var(--yellow); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: .35; box-shadow: none; transform: none; cursor: not-allowed; }
  .btn-yellow { background: var(--yellow); color: var(--ink); }
  .btn-ghost { background: var(--paper); border: 1.5px solid var(--ink); }
  .btn-text { min-height: 40px; padding: 0 10px; color: var(--muted); font-weight: 500; font-size: 14px; }
  .btn-text:hover { color: var(--ink); }

  /* ---------- step header ---------- */
  .step-head { display: flex; gap: 14px; align-items: center; margin-bottom: 6px; }
  .step-head h2 { font-size: 26px; font-weight: 900; line-height: 1.2; }
  .step-sub { color: var(--muted); margin-bottom: 22px; font-size: 15px; }
  .step-count { font-size: 12px; color: var(--muted); letter-spacing: 1px; margin-bottom: 10px; }
  .required-mark, .field-error { color: #b42318; }
  .required-mark { margin-inline-start: 4px; font-weight: 700; }
  .field-error { font-size: 14px; margin-top: 6px; }
  [aria-invalid="true"] { border-color: #b42318; }
  .validation-summary { border: 1px solid #b42318; border-radius: 12px; padding: 16px; margin-bottom: 20px; background: #fff4f2; }
  .validation-summary ul { padding-inline-start: 20px; margin-top: 8px; }
  .validation-summary button { text-align: start; text-decoration: underline; text-underline-offset: 3px; }
  .none-choice { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; margin: 12px 0; cursor: pointer; }
  .none-choice input { width: 20px; height: 20px; flex: none; margin-top: 2px; accent-color: var(--ink); }
  [data-validation], .field, .q { scroll-margin-top: 100px; }

  /* ---------- fields ---------- */
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card-title { font-weight: 900; font-size: 18px; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .pill { font-size: 12px; font-weight: 700; background: var(--ink); color: var(--yellow); padding: 2px 10px; border-radius: 999px; }
  .pill.now { background: var(--yellow); color: var(--ink); }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field > label, .label { display: block; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .help { font-size: 13px; color: var(--muted); margin: -2px 0 8px; }
  .input, .textarea {
    width: 100%; border: 1.5px solid var(--line-strong); background: var(--yellow-soft); border-radius: 10px;
    padding: 12px 14px; font-size: 16px; transition: border-color .2s, background .2s;
  }
  .input:focus, .textarea:focus { outline: none; border-color: var(--ink); background: #fff; }
  .input::placeholder, .textarea::placeholder { color: var(--hint); }
  .textarea { min-height: 92px; resize: vertical; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1.5px solid var(--line-strong); background: var(--paper); border-radius: 999px;
    padding: 6px 14px; font-size: 14px; min-height: 36px; transition: all .15s;
  }
  .chip:hover { border-color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip.add::before { content: "+ "; color: var(--muted); }
  .suggest { margin-top: 8px; }
  .suggest .chip { font-size: 13px; min-height: 32px; padding: 4px 12px; border-style: dashed; color: var(--muted); }

  .tagbox {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1.5px solid var(--line-strong);
    background: var(--yellow-soft); border-radius: 10px; padding: 8px; min-height: 52px; cursor: text;
  }
  .tagbox:focus-within { border-color: var(--ink); background: #fff; }
  .tag { display: inline-flex; align-items: center; gap: 4px; background: var(--ink); color: #fff; border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 14px; }
  .tag button { width: 22px; height: 22px; border-radius: 50%; color: #bbb; font-size: 15px; line-height: 1; }
  .tag button:hover { background: #333; color: #fff; }
  .tag.gap { background: var(--yellow); color: var(--ink); }
  .tag.gap button { color: #6b5a00; }
  .tagbox input { flex: 1; min-width: 120px; border: 0; background: transparent; padding: 6px; font-size: 16px; }
  .tagbox input:focus { outline: none; }

  .example-box { background: var(--soft); border-left: 4px solid var(--yellow); border-radius: 0 10px 10px 0; padding: 12px 14px; font-size: 14px; color: var(--ink-2); margin-bottom: 16px; }

  /* timeline (plan step) */
  .tl { position: relative; padding-left: 26px; }
  .tl::before { content: ""; position: absolute; left: 8px; top: 10px; bottom: 10px; width: 2px; background: var(--ink); }
  .tl .card { position: relative; }
  .tl .card::before {
    content: ""; position: absolute; left: -24px; top: 24px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--paper); border: 3px solid var(--ink);
  }
  .tl .card.is-now::before { background: var(--yellow); }
  .collapse-head { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; }
  .collapse-head .sum { flex: 1; font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .collapse-head .chev { transition: transform .2s; color: var(--muted); }
  .card[data-open="true"] .chev { transform: rotate(180deg); }
  .card[data-open="false"] .collapse-body { display: none; }
  .collapse-body { margin-top: 14px; }

  /* gap step */
  .gap-hero { background: var(--ink); color: #fff; border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
  .gap-hero h3 { font-size: 18px; font-weight: 900; margin-bottom: 4px; }
  .gap-hero p { color: #bdbdbd; font-size: 14px; margin-bottom: 14px; }
  .gap-hero .empty { color: #8a8a8a; font-size: 14px; }

  /* jobs step */
  .job-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
  .job-tab {
    flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
    border: 1.5px solid var(--line-strong); background: var(--paper); font-weight: 700; font-size: 14px;
  }
  .job-tab[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .job-tab .sc { font-size: 12px; background: var(--yellow); color: var(--ink); border-radius: 999px; padding: 0 7px; }
  .q { padding: 14px 0; border-top: 1px solid var(--line); }
  .q:first-of-type { border-top: 0; }
  .q-text { font-weight: 700; font-size: 15px; }
  .q-hint { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .seg button {
    min-height: 44px; border-radius: 10px; border: 1.5px solid var(--line-strong); background: var(--paper);
    font-weight: 700; transition: all .15s;
  }
  .seg button:hover { border-color: var(--ink); }
  .seg button.yes[aria-pressed="true"] { background: var(--yellow); border-color: var(--ink); }
  .seg button.no[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .scorebar { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--soft); border-radius: 12px; margin-top: 8px; }
  .score-num { font-size: 34px; font-weight: 900; line-height: 1; }
  .score-num small { font-size: 16px; color: var(--muted); }
  .verdict-tag { display: inline-block; font-weight: 900; padding: 4px 12px; border-radius: 8px; font-size: 15px; }
  .v-go { background: var(--yellow); color: var(--ink); }
  .v-mid { background: #fff; border: 1.5px solid var(--ink); }
  .v-no { background: var(--ink); color: #fff; }
  .v-none { background: var(--line); color: var(--muted); }

  /* ---------- bottom nav ---------- */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(251,250,246,.95);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .bottom-nav-inner { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .bottom-nav .btn-primary { flex: 1; }
  .nav-msg { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 8px; }

  /* ---------- report ---------- */
  .report-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .report { background: var(--paper); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .r-head { background: var(--ink); color: #fff; padding: 26px 22px 22px; }
  .r-head .kicker { color: #9a9a9a; }
  .r-head h2 { font-size: 30px; font-weight: 900; line-height: 1.2; margin: 6px 0 8px; }
  .r-head h2 span { color: var(--yellow); }
  .r-head .r-meta { font-size: 13px; color: #bdbdbd; }
  .r-sec { padding: 22px; border-top: 1px solid var(--line); }
  .r-sec h3 { font-size: 13px; letter-spacing: 1.5px; color: var(--muted); font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .r-sec h3 .num { width: 24px; height: 24px; font-size: 12px; }
  .r-goal { font-size: 28px; font-weight: 900; line-height: 1.25; }
  .r-goal mark { padding: 0 4px; }
  .r-sub { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .r-day { margin-top: 14px; background: var(--soft); border-radius: 12px; padding: 14px; font-size: 15px; }
  .r-label { font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; letter-spacing: 1px; }
  .r-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .r-chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-strong); }
  .r-chip.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  .r-chip.y { background: var(--yellow); border-color: var(--yellow); font-weight: 700; }

  .r-tl { position: relative; padding-left: 28px; }
  .r-tl::before { content: ""; position: absolute; left: 9px; top: 8px; bottom: 8px; width: 2px; background: var(--ink); }
  .r-stop { position: relative; padding-bottom: 18px; }
  .r-stop:last-child { padding-bottom: 0; }
  .r-stop::before { content: ""; position: absolute; left: -25px; top: 6px; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); }
  .r-stop.now::before { background: var(--yellow); }
  .r-when { font-size: 12px; font-weight: 900; letter-spacing: 1px; color: var(--muted); }
  .r-role { font-weight: 900; font-size: 17px; margin: 2px 0 6px; }
  .r-role.empty { color: var(--hint); font-weight: 500; }
  .r-stop .r-chips { margin-top: 4px; }

  .r-gap { background: var(--yellow); margin: 0; padding: 22px; }
  .r-gap h3 { color: var(--ink); }
  .r-gap .big { font-size: 20px; font-weight: 900; margin-bottom: 10px; }
  .r-gap .r-chip { background: #fff; border-color: #fff; font-weight: 700; }

  .r-jobs { display: grid; gap: 12px; }
  .r-job { border: 1.5px solid var(--line-strong); border-radius: 14px; padding: 16px; }
  .r-job.best { border-color: var(--ink); box-shadow: 0 4px 0 var(--yellow); }
  .r-job-top { display: flex; align-items: center; gap: 12px; }
  .r-job-name { flex: 1; font-weight: 900; font-size: 17px; }
  .r-job-name small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
  .r-score { font-size: 28px; font-weight: 900; }
  .r-score small { font-size: 14px; color: var(--muted); }
  .bars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 12px 0 10px; }
  .bars i { height: 8px; border-radius: 4px; background: var(--line); }
  .bars i.on { background: var(--ink); }
  .r-ans { font-size: 13px; color: var(--ink-2); display: grid; gap: 3px; margin-top: 10px; }
  .r-ans .x { color: var(--hint); }
  .best-flag { display: table; font-size: 11px; font-weight: 900; background: var(--yellow); padding: 2px 8px; border-radius: 6px; margin-bottom: 4px; }
  .r-marker { font-size: 13px; color: var(--ink-2); margin: -2px 0 6px; }
  .r-why { margin-top: 14px; border-left: 4px solid var(--yellow); padding: 4px 0 4px 12px; font-size: 16px; font-weight: 700; }
  .r-why span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 1px; margin-bottom: 2px; }
  .r-support-grid { display: grid; gap: 8px; }
  .r-support { display: grid; grid-template-columns: 44px 1fr; align-items: start; gap: 8px; font-size: 14px; }
  .r-support b { padding-top: 2px; }
  .r-acts { display: grid; gap: 10px; }
  .r-act { display: flex; gap: 12px; align-items: flex-start; font-weight: 700; font-size: 16px; }
  .r-act .box { flex: none; width: 20px; height: 20px; border: 2px solid var(--ink); border-radius: 5px; margin-top: 3px; }
  .r-act small { display: block; font-weight: 500; font-size: 13px; color: var(--muted); }
  .r-first { margin-top: 16px; background: var(--ink); color: #fff; border-radius: 12px; padding: 14px 16px; font-weight: 700; }
  .r-first span { display: block; color: var(--yellow); font-size: 12px; letter-spacing: 1px; margin-bottom: 2px; }
  .r-foot { background: var(--ink); color: #fff; padding: 22px; display: flex; flex-direction: column; gap: 6px; }
  .r-foot .q { border: 0; padding: 0; font-size: 18px; font-weight: 900; }
  .r-foot .q b { color: var(--yellow); }
  .r-foot small { color: #9a9a9a; font-size: 12px; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 50;
    transition: all .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .fade-in { animation: fadeIn .35s ease both; }
  .no-anim .fade-in { animation: none; }
  .hero p.lead b { white-space: nowrap; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  footer.site { text-align: center; font-size: 13px; color: var(--muted); padding: 30px 0 0; }
  footer.site a { color: var(--ink); font-weight: 700; }

  @media (min-width: 640px) {
    .steps-preview { grid-template-columns: repeat(3, 1fr); }
    .sp { flex-direction: column; }
  }

  /* ---------- print: report only ---------- */
  @media print {
    @page { size: A4; margin: 10mm; }
    body { background: #fff; }
    .topbar, .bottom-nav, .report-actions, .no-print, footer.site, .toast { display: none !important; }
    main { padding: 0; max-width: none; }
    .report { box-shadow: none; border: 0; }
    .r-sec, .r-job, .r-stop { break-inside: avoid; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
<script>try{if(sessionStorage.getItem("mc-transition"))document.documentElement.classList.add("mc-arriving")}catch(e){}</script>
<style>
  /* Site-wide page transition cover (matches PageTransition.tsx on the main site). */
  #mc-cover { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #07080c; color: #f4f4f5; opacity: 0; pointer-events: none; transition: opacity .38s cubic-bezier(.16,1,.3,1); font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; }

        <div class="field"><span class="label">${x.haveNet}</span>${tags("now.network", x.haveNetPh, uniq([...S.plan.y1.network, ...S.plan.y3.network]))}${noneChoice("now.network", tr("No relevant contacts or resources yet", "目前还没有相关人脉或资源"))}</div>

  function viewReport() {
    const x = L.report;
    const g = gaps();
    const jobs = usedJobs();
    const completeJobs = jobs.filter((j) => answered(j) === 5);
    const best = completeJobs.length ? Math.max(...completeJobs.map(score)) : -1;
    const bestIdx = jobs.filter((j) => answered(j) === 5 && score(j) === best).map((j) => j.i);
    const chipList = (arr, cls = "") => arr.length ? `<div class="r-chips">${arr.map((s) => `<span class="r-chip ${cls}">${esc(s)}</span>`).join("")}</div>` : "";
    const stops = STOP_KEYS.map((k) => {
      const p = S.plan[k];
      return `<div class="r-stop"><div class="r-when">${L.stops[k]}</div>
        <div class="r-role ${p.role ? "" : "empty"}">${esc(p.role || x.notWritten)}</div>
        ${p.marker ? `<div class="r-marker">${x.markerLabel}${esc(p.marker)}</div>` : ""}
        ${chipList(p.skills, "dark")}${p.network.length ? `<div style="margin-top:6px">${chipList(p.network)}</div>` : ""}</div>`;
    }).join("");
    const supportRows = L.support.filter(([k]) => S.support[k].length)
      .map(([k, label]) => `<div class="r-support"><b>${label}</b>${chipList(S.support[k])}</div>`).join("");
    const acknowledgedNone = (path, label) => S.none[path] === true ? `<p class="q-hint">${label}: ${tr("None reported", "已确认暂无")}</p>` : "";
    const acts = S.actions.filter((a) => a.what.trim());
    const jobCards = jobs.map((j) => {
      const v = verdict(j); const n = score(j);
      const isBest = bestIdx.includes(j.i) && jobs.length > 1 && best > 0;
      return `<div class="r-job ${isBest ? "best" : ""}">
        <div class="r-job-top">
          <div class="r-job-name">${isBest ? `<span class="best-flag">${x.best}</span>` : ""}${esc(j.name || jobLabel(j.i))}<small>${esc(jobLabel(j.i))}</small></div>
          <div class="r-score">${n}<small>/5</small></div>
        </div>
        <div class="bars">${[0, 1, 2, 3, 4].map((i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</div>
        <span class="verdict-tag ${v.cls}">${v.t}</span> <span class="q-hint" style="display:inline">${v.d}</span>
        ${n >= 2 && n <= 3 && j.leave ? `<div class="q-hint" style="margin-top:6px">${x.leaveBy(fmtMonth(j.leave))}</div>` : ""}
        <div class="r-ans">${L.questions.map(([t], i) => `<div class="${j.answers[i] === true ? "" : "x"}">${j.answers[i] === true ? "✓" : j.answers[i] === false ? "✗" : "–"} ${t}</div>`).join("")}</div>
      </div>`;
    }).join("");
    const gapTotal = g.skills.length + g.network.length;
    return `<section class="fade-in">
      <div class="report-actions no-print">
        <button class="btn btn-primary" data-act="png">${x.png}</button>
        <button class="btn btn-ghost" data-act="print">${x.pdf}</button>
        <button class="btn btn-text" data-go="1">${x.edit}</button>
      </div>
      <article class="report" id="report">
        <div class="r-head">
          <div class="kicker">${x.kicker}</div>
          <h2>${esc(x.who(S.name.trim()))}<span>${x.titleA}</span>${x.titleB}</h2>
          <div class="r-meta">${esc(S.date)} · ${x.redo}</div>
        </div>
        <div class="r-sec">
          <h3><span class="num">1</span>${x.goal}</h3>
          <div class="r-goal">${x.goalLine}<mark>${esc(S.goal.role || x.notWritten)}</mark></div>
          ${S.goal.industry ? `<div class="r-sub">${x.field}${esc(S.goal.industry)}</div>` : ""}
          ${S.goal.day ? `<div class="r-label">${x.day}</div><div class="r-day">“${esc(S.goal.day)}”</div>` : ""}
          ${S.goal.life ? `<div class="r-label">${x.life}</div><div class="r-day">“${esc(S.goal.life)}”</div>` : ""}
          ${S.goal.criteria.length ? `<div class="r-label">${x.criteria}</div>${chipList(S.goal.criteria.map((c) => "✓ " + c), "y")}` : ""}
          ${S.goal.why ? `<div class="r-why"><span>${x.why}</span>${esc(S.goal.why)}</div>` : ""}
          ${S.goal.strengths.length ? `<div class="r-label">${x.strengths}</div>${chipList(S.goal.strengths, "dark")}` : ""}
          ${S.goal.edge ? `<div class="r-label">${x.edge}</div><div>${esc(S.goal.edge)}</div>` : ""}
        </div>
        <div class="r-sec">
          <h3><span class="num">2</span>${x.path}</h3>
          <div class="r-tl">${stops}
            <div class="r-stop now"><div class="r-when">${x.now}</div>
              <div class="r-role ${S.now.role ? "" : "empty"}">${esc(S.now.role || x.notWritten)}</div>
              ${chipList(S.now.skills)}${acknowledgedNone("now.skills", L.gap.haveSkills)}${chipList(S.now.network)}${acknowledgedNone("now.network", L.gap.haveNet)}</div>
          </div>
        </div>
        <div class="r-gap">
          <h3><span class="num">⭐</span>${x.gapTitle}</h3>
          ${gapTotal
            ? `<div class="big">${x.gapCount(gapTotal)}</div>${chipList([...g.skills, ...g.network])}`
            : `<div class="big">${x.noGap}</div><div>${x.noGapHelp}</div>`}
        </div>
        ${S.obstacles.length || supportRows || S.none.obstacles || S.none.support ? `<div class="r-sec">
          <h3><span class="num">3</span>${x.obstacles}</h3>
          ${S.obstacles.length ? `<div class="r-label" style="margin-top:0">${x.mightStop}</div>${chipList(S.obstacles)}` : ""}
          ${supportRows ? `<div class="r-label">${x.supportNeeded}</div><div class="r-support-grid">${supportRows}</div>` : ""}
          ${acknowledgedNone("obstacles", L.gap.obstacles)}${acknowledgedNone("support", L.gap.support)}
        </div>` : ""}
        <div class="r-sec">
          <h3><span class="num">4</span>${x.jobs}</h3>
          ${jobs.length ? `<div class="r-jobs">${jobCards}</div>` : `<div class="q-hint">${x.noJobs}</div>`}
        </div>
        <div class="r-sec">
          <h3><span class="num">5</span>${x.acts}</h3>
          ${acts.length ? `<div class="r-acts">${acts.map((a) => `<div class="r-act"><span class="box"></span><div>${esc(a.what)}${a.by ? `<small>${x.byMonth(fmtMonth(a.by))}</small>` : ""}</div></div>`).join("")}</div>` : `<div class="q-hint">${x.noActs}</div>`}
          ${S.firstStep.trim() ? `<div class="r-first"><span>${x.first}</span>${esc(S.firstStep)}</div>` : ""}
        </div>
        <div class="r-foot">
          <div class="q">${x.quote[0]}<b>${x.quote[1]}</b>${x.quote[2]}</div>
          <small>Ming Creatives · mingcreatives.com/product/career-plan</small>
        </div>
      </article>
      <footer class="site no-print">${x.madeBy}<br><a href="/">mingcreatives.com</a></footer>
    </section>`;
  }

  // ---------- render ----------
  const VIEWS = [viewLanding, viewGoal, viewPlan, viewGap, viewJobs, viewActions, viewReport];
  function renderChrome() {
    document.documentElement.lang = L.htmlLang;
    document.getElementById("brand-name").textContent = L.brand;
    document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
  }
  function render(scrollTop = true) {
    if (S.step === REPORT) {
      const missing = firstIncomplete();
      if (missing) { S.step = missing.step; showErrors = true; save(); }
    }
    renderChrome();
    app.innerHTML = VIEWS[S.step]();
    decorateFields();
    document.getElementById("bar").style.width = `${Math.min(S.step, REPORT) / REPORT * 100}%`;
    renderNav();
    if (scrollTop) window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }
  function renderNav() {
    if (S.step === 0 || S.step === REPORT) { nav.hidden = true; return; }
    nav.hidden = false;
    const last = S.step === TOTAL;
    const missing = last ? firstIncomplete() : null;
    const count = missing ? missing.errors.length : stepErrors(S.step).length;
    nav.innerHTML = `${count ? `<div class="nav-msg">${tr(`${count} required item(s) left · ${last ? "Create report" : "Next"} will show what's missing`, `还有 ${count} 项必填内容 · 点击${last ? "生成报告" : "下一步"}查看`)}</div>` : ""}
      <div class="bottom-nav-inner">
        <button class="btn btn-ghost" data-go="${S.step - 1}" aria-label="${L.nav.back}">←</button>
        ${last
          ? `<button class="btn btn-primary" data-go="${REPORT}">${L.nav.generate}</button>`
          : `<button class="btn btn-primary" data-go="${S.step + 1}">${L.nav.next(L.steps[S.step])}</button>`}
      </div>`;
  }
  function go(n) {
    const target = Math.max(0, Math.min(REPORT, n));
    if (target > S.step) {
      const missing = firstIncomplete(target);
      if (missing) { S.step = missing.step; showErrors = true; save(); render(); focusField(missing.errors[0].path); return; }
    }
    S.step = target; showErrors = false; save(); app.classList.remove("no-anim"); render();
  }
  function setLang(lang) {
    if (lang === S.lang || !T[lang]) return;
    S.lang = lang; L = T[lang]; save();
    app.classList.add("no-anim"); render(false);
  }

  // ---------- events ----------
  document.addEventListener("input", (e) => {
    const b = e.target.dataset.bind;
    if (b) {
      set(b, e.target.value);
      if (b.startsWith("jobs.")) { refreshJobChrome(); }
      if (!b.startsWith("jobs.")) renderNav();
      if (showErrors) decorateFields();
      return;
    }
    const t = e.target.dataset.tag;
    if (t && /[,，、]/.test(e.target.value)) addTags(t, e.target.value);
  });
  document.addEventListener("keydown", (e) => {
    const t = e.target.dataset?.tag;
    if (!t) return;
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); addTags(t, e.target.value); }
    if (e.key === "Backspace" && !e.target.value) {
      const list = get(t); if (list.length) { list.pop(); save(); rerenderKeepFocus(t); }
    }
  });
  document.addEventListener("focusout", (e) => {
    const t = e.target.dataset?.tag;
    if (t && !rendering && e.target.value.trim()) addTags(t, e.target.value, false);
  });
  function addTags(path, raw, keepFocus = true) {
    const parts = raw.split(/[,，、\n]/).map((s) => s.trim()).filter(Boolean);
    if (!parts.length) return;
    set(path, uniq([...get(path), ...parts]));
    keepFocus ? rerenderKeepFocus(path) : setTimeout(() => rerenderKeepFocus(null), 0);
  }
  let rendering = false;
  function rerenderKeepFocus(path) {
    const y = window.scrollY;
    rendering = true;
    app.classList.add("no-anim");
    render(false);
    rendering = false;
    window.scrollTo(0, y);
    if (path) document.querySelector(`[data-tag="${path}"]`)?.focus();
  }
  function refreshJobChrome() {
    // update tabs + score without losing input focus
    const a = S.activeJob, j = S.jobs[a], v = verdict(j);
    const skip = document.querySelector("[data-skip-jobs]");
    if (skip) { skip.checked = S.jobsSkipped; skip.disabled = usedJobs().length > 0; }
    document.querySelectorAll("[data-tab]").forEach((el, i) => {
      const item = S.jobs[i];
      el.innerHTML = `${esc(item.name.trim() || jobLabel(i))}${answered(item) ? `<span class="sc">${score(item)}/5</span>` : ""}`;
    });
    const sb = document.getElementById("scorebar");
    if (sb) sb.innerHTML = `<div class="score-num">${score(j)}<small>/5</small></div><div><span class="verdict-tag ${v.cls}">${v.t}</span><div class="q-hint">${v.d}</div></div>`;
    const lv = document.getElementById("leave");
    if (lv) lv.hidden = !(score(j) >= 2 && score(j) <= 3);
    renderNav();
    if (showErrors) decorateFields();
  }

  document.addEventListener("change", (e) => {
    const path = e.target.dataset.none;
    if (path) {
      S.none[path] = e.target.checked;
      if (e.target.checked) {
        if (path === "support") Object.keys(S.support).forEach((key) => S.support[key] = []);
        else set(path, []);
      }
      save(); return rerenderKeepFocus(null);
    }
    if (e.target.matches("[data-skip-jobs]")) { S.jobsSkipped = e.target.checked && !usedJobs().length; save(); rerenderKeepFocus(null); }
  });

  document.addEventListener("click", async (e) => {
    const el = e.target.closest("button, .tagbox");
    if (!el) return;
    const d = el.dataset;
    if (d.focusField) return focusField(d.focusField);
    if (el.classList.contains("tagbox") && !e.target.closest("button")) { el.querySelector("input")?.focus(); return; }
    if (d.lang) return setLang(d.lang);
    if (d.go !== undefined) return go(+d.go);
    if (d.pick) {
      const cur = get(d.pick);
      if (d.multi === "true") {
        const has = cur.includes(d.val);
        if (!has && cur.length >= 3) return toast(L.toast.max3);
        set(d.pick, has ? cur.filter((x) => x !== d.val) : [...cur, d.val]);
      } else set(d.pick, cur === d.val ? "" : d.val);
      return rerenderKeepFocus(null);
    }
    if (d.addtag) { set(d.addtag, uniq([...get(d.addtag), d.val])); return rerenderKeepFocus(null); }
    if (d.idea) {
      const slot = S.actions.find((a) => !a.what.trim());
      if (!slot) return toast(L.toast.full);
      slot.what = d.val || d.idea; save(); return rerenderKeepFocus(null);
    }
    if (d.untag) { const l = get(d.untag); l.splice(+d.i, 1); save(); return rerenderKeepFocus(d.untag); }
    if (d.openStop) { S.open = S.open === d.openStop ? "" : d.openStop; save(); return rerenderKeepFocus(null); }
    if (d.tab !== undefined) { S.activeJob = +d.tab; save(); return render(false); }
    if (d.ans !== undefined) {
      S.jobsSkipped = false;
      const j = S.jobs[S.activeJob]; const val = d.val === "1";
      j.answers[+d.ans] = j.answers[+d.ans] === val ? null : val; save();
      el.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", j.answers[+d.ans] === (b.dataset.val === "1")));
      return refreshJobChrome();
    }
    if (d.act === "clear-job") { S.jobs[S.activeJob] = job(); save(); return rerenderKeepFocus(null); }
    if (d.act === "example") { S = EXAMPLE(); S.none["now.network"] = values(S.now.network).length === 0; showErrors = false; save(); toast(L.toast.example); return render(); }
    if (d.act === "reset") { if (confirm(L.toast.resetConfirm)) { const lang = S.lang; S = blank(); S.lang = lang; save(); render(); } return; }
    if (d.act === "print") { if (requireComplete()) window.print(); return; }
    if (d.act === "png") return downloadPng(el);
  });

  async function downloadPng(btn) {
    if (!requireComplete()) return;
    if (!window.html2canvas) return toast(L.toast.pngFail);
    btn.disabled = true; const old = btn.textContent; btn.textContent = L.toast.busy;
    try {
      await document.fonts?.ready;
      const node = document.getElementById("report");
      const canvas = await html2canvas(node, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
      const url = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = url; a.download = L.file(S.name.trim());
      document.body.appendChild(a); a.click(); a.remove();
      toast(L.toast.pngDone);
    } catch (err) {
      toast(L.toast.pngErr);
    } finally { btn.disabled = false; btn.textContent = old; }
  }

  render();
})();
</script>
<div id="mc-cover" role="status" aria-live="polite">
  <img src="/logo-resized.png" alt="">
  <span class="mc-brand">ming.creatives</span>
  <span class="mc-label" id="mc-cover-label">职业规划表</span>
  <span class="mc-bar" aria-hidden="true"><i></i></span>
</div>
<script>
(() => {
  const KEY = "mc-transition";
  const cover = document.getElementById("mc-cover");
  const labelEl = document.getElementById("mc-cover-label");
  const LABELS = [[/^\/$/, "Home"], [/^\/ai-projects\/?$/, "AI Projects"], [/^\/experiences\/?$/, "Experiences"], [/^\/side-projects\/?$/, "Side Projects"], [/^\/work\//, "Case study"]];
  const labelFor = (path) => (LABELS.find(([re]) => re.test(path)) || [, "Ming Creatives"])[1];
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Arrived through a transition: hold the cover briefly, then fade it out.
  let arrived = null;
  try { arrived = sessionStorage.getItem(KEY); sessionStorage.removeItem(KEY); } catch (e) {}
  if (arrived) {
    labelEl.textContent = arrived;
    cover.classList.add("on");
    setTimeout(() => {
      document.documentElement.classList.remove("mc-arriving");
      requestAnimationFrame(() => requestAnimationFrame(() => cover.classList.remove("on")));
    }, reduced ? 0 : 350);
  }

  // Leaving for another page on the site: cover first, then load it.
  document.addEventListener("click", (event) => {
    if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const a = event.target.closest && event.target.closest("a");
    if (!a || !a.href || (a.target && a.target !== "_self") || a.hasAttribute("download")) return;
    const url = new URL(a.href, location.href);
    if (url.origin !== location.origin || url.pathname === location.pathname) return;
    event.preventDefault();
    const label = labelFor(url.pathname);
    labelEl.textContent = label;
    try { sessionStorage.setItem(KEY, label); } catch (e) {}
    cover.classList.add("on");
    setTimeout(() => location.assign(url.href), reduced ? 0 : 380);
  }, true);

  // Coming back via the browser's back/forward cache: never leave it covered.
  addEventListener("pageshow", (event) => { if (event.persisted) cover.classList.remove("on"); });
})();
</script>
<script defer src="/_vercel/insights/script.js"></script>
